version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: LanguageTool server for enhanced grammar checking
  languagetool:
    image: silviof/docker-languagetool
    ports:
      - "8081:8010"
    environment:
      - LT_JAVA_OPTS=-Xmx2g
    restart: unless-stopped
    profiles:
      - enhanced
